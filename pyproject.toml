[project]
name = "trustmap"
version = "0.1.0"
description = "Find abandoned outside infrastructure a repository still trusts."
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.9.1",
    "fastapi>=0.119.0",
    "httpx>=0.28.1",
    "mcp>=1.12,<2",
    "openai>=2.0.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "tldextract>=5.4.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
trustmap = "scanner.cli:main"
trustmap-mcp = "scanner.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner", "api"]

[tool.hatch.build.targets.wheel.force-include]
"api/demo_scan.json" = "api/demo_scan.json"
"api/sample_repos.json" = "api/sample_repos.json"

"api/static/index.html" = "api/static/index.html"
"api/static/app.css" = "api/static/app.css"
"api/static/app.js" = "api/static/app.js"
"scanner/compromised.json" = "scanner/compromised.json"
"scanner/data/tranco_top100k.txt.gz" = "scanner/data/tranco_top100k.txt.gz"
"scanner/data/README.md" = "scanner/data/README.md"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: live network tests",
]
